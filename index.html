<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bubu ❤️ Dudu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Pacifico&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --pink:      #FFB7C5;
      --pink-deep: #FF8FAB;
      --cream:     #FFF5F7;
      --brown:     #C48B6C;
      --brown-dk:  #8B5E3C;
      --panda:     #F2EDE9;
      --accent:    #FF6B8A;
      --soft-blue: #C8E6F5;
      --text:      #5C3D2E;
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'Nunito', sans-serif;
      background: var(--cream);
      color: var(--text);
      overflow-x: hidden;
    }

    /* ── FLOATING HEARTS BACKGROUND ── */
    #hearts-bg {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }
    .heart-particle {
      position: absolute;
      bottom: -60px;
      font-size: 1.4rem;
      opacity: 0;
      animation: floatUp linear infinite;
    }
    @keyframes floatUp {
      0%   { transform: translateY(0) rotate(0deg); opacity: 0.6; }
      100% { transform: translateY(-110vh) rotate(30deg); opacity: 0; }
    }

    /* ── NAV ── */
    nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      background: rgba(255,245,247,0.88);
      backdrop-filter: blur(12px);
      border-bottom: 2px solid var(--pink);
      padding: 12px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .nav-logo {
      font-family: 'Pacifico', cursive;
      font-size: 1.4rem;
      color: var(--accent);
      letter-spacing: 1px;
    }


    /* ── HERO ── */
    #hero {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 100px 24px 60px;
      background: linear-gradient(160deg, #ffe4ec 0%, #fff0f5 50%, #fce8f3 100%);
    }
    .hero-title {
      font-family: 'Pacifico', cursive;
      font-size: clamp(2.8rem, 8vw, 5.5rem);
      color: var(--accent);
      line-height: 1.15;
      margin-bottom: 16px;
      animation: popIn .8s cubic-bezier(.34,1.56,.64,1) both;
    }
    .hero-sub {
      font-size: clamp(1rem, 3vw, 1.3rem);
      font-weight: 600;
      color: var(--brown);
      margin-bottom: 40px;
      animation: popIn .9s .15s cubic-bezier(.34,1.56,.64,1) both;
    }
    @keyframes popIn {
      from { opacity: 0; transform: scale(.7) translateY(20px); }
      to   { opacity: 1; transform: scale(1) translateY(0); }
    }

    /* Hero duo image */
    .hero-img-wrap {
      position: relative;
      width: min(320px, 80vw);
      animation: float 3.5s ease-in-out infinite;
    }
    @keyframes float {
      0%,100% { transform: translateY(0); }
      50%      { transform: translateY(-14px); }
    }
    .hero-img-wrap img {
      width: 100%;
      border-radius: 50%;
      border: 6px solid white;
      box-shadow: 0 20px 60px rgba(255,107,138,.35);
    }
    .hero-badge {
      position: absolute;
      bottom: -14px; right: -14px;
      background: var(--accent);
      color: white;
      font-family: 'Pacifico', cursive;
      font-size: .85rem;
      padding: 8px 14px;
      border-radius: 50px;
      box-shadow: 0 4px 16px rgba(255,107,138,.4);
      animation: wiggle 2s .5s ease-in-out infinite;
    }
    @keyframes wiggle {
      0%,100% { transform: rotate(-4deg); }
      50%      { transform: rotate(4deg); }
    }

    .scroll-hint {
      margin-top: 48px;
      font-size: .85rem;
      color: var(--pink-deep);
      font-weight: 600;
      animation: bounce 1.4s ease-in-out infinite;
    }
    @keyframes bounce {
      0%,100% { transform: translateY(0); }
      50%      { transform: translateY(8px); }
    }

    /* ── SECTION WRAPPER ── */
    section {
      position: relative;
      z-index: 1;
      padding: 80px 24px;
    }
    .section-title {
      font-family: 'Pacifico', cursive;
      font-size: clamp(1.8rem, 5vw, 2.6rem);
      color: var(--accent);
      text-align: center;
      margin-bottom: 8px;
    }
    .section-sub {
      text-align: center;
      color: var(--brown);
      font-weight: 600;
      margin-bottom: 48px;
      font-size: 1rem;
    }

    /* ── GALLERY ── */
    #gallery { background: white; }
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 16px;
      max-width: 1100px;
      margin: 0 auto;
    }
    .gallery-card {
      border-radius: 20px;
      overflow: hidden;
      position: relative;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(255,107,138,.15);
      transition: transform .3s, box-shadow .3s;
    }
    .gallery-card:hover {
      transform: translateY(-8px) scale(1.03);
      box-shadow: 0 16px 40px rgba(255,107,138,.3);
    }
    .gallery-card img {
      width: 100%;
      aspect-ratio: 1;
      object-fit: cover;
      display: block;
      transition: transform .4s;
    }
    .gallery-card:hover img { transform: scale(1.08); }
    .gallery-card .overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(255,107,138,.6) 0%, transparent 60%);
      opacity: 0;
      transition: opacity .3s;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding-bottom: 14px;
    }
    .gallery-card:hover .overlay { opacity: 1; }
    .overlay span { color: white; font-weight: 800; font-size: .9rem; }

    /* ── LIGHTBOX ── */
    #lightbox {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 999;
      background: rgba(0,0,0,.75);
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(4px);
    }
    #lightbox.open { display: flex; }
    #lightbox img {
      max-width: 90vw;
      max-height: 85vh;
      border-radius: 24px;
      box-shadow: 0 24px 80px rgba(0,0,0,.5);
      animation: popIn .3s cubic-bezier(.34,1.56,.64,1);
    }
    #lightbox-close {
      position: absolute;
      top: 20px; right: 24px;
      font-size: 2rem;
      color: white;
      cursor: pointer;
      line-height: 1;
      background: rgba(255,255,255,.2);
      border-radius: 50%;
      width: 44px; height: 44px;
      display: flex; align-items: center; justify-content: center;
      transition: background .2s;
    }
    #lightbox-close:hover { background: rgba(255,107,138,.6); }



    /* ── REVEAL ANIMATION ── */
    .reveal {
      opacity: 0;
      transform: translateY(32px);
      transition: opacity .7s ease, transform .7s ease;
    }
    .reveal.visible {
      opacity: 1;
      transform: translateY(0);
    }

    /* ── RESPONSIVE ── */
    @media (max-width: 600px) {
      .nav-links { gap: 14px; }
      .gallery-grid { grid-template-columns: repeat(2, 1fr); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>

<!-- Floating hearts -->
<div id="hearts-bg"></div>

<!-- NAV -->
<nav>
  <span class="nav-logo">Bubu ❤️ Dudu</span>
</nav>

<!-- HERO -->
<section id="hero">
  <h1 class="hero-title">Bubu ❤️ Dudu</h1>
  <p class="hero-sub">The world's cutest couple — together forever 🐻🐼</p>
  <div class="hero-img-wrap">
    <img src="1000270925.jpg" alt="Bubu and Dudu together" />
    <span class="hero-badge">Together Forever!!</span>
  </div>
  <p class="scroll-hint">↓ scroll for cuteness ↓</p>
</section>

<!-- GALLERY -->
<section id="gallery">
  <h2 class="section-title reveal">Our Cute Gallery</h2>
  <p class="section-sub reveal">Every picture tells a love story 🌸</p>
  <div class="gallery-grid reveal" id="galleryGrid"></div>
</section>

<!-- LIGHTBOX -->
<div id="lightbox">
  <span id="lightbox-close">✕</span>
  <img id="lightbox-img" src="" alt="" />
</div>



<script>
  /* ── FLOATING HEARTS ── */
  const hBg = document.getElementById('hearts-bg');
  const emojis = ['❤️','🩷','💕','💗','💖','🐻','🐼','🌸'];
  for (let i = 0; i < 22; i++) {
    const el = document.createElement('span');
    el.className = 'heart-particle';
    el.textContent = emojis[Math.floor(Math.random() * emojis.length)];
    el.style.left = Math.random() * 100 + 'vw';
    el.style.fontSize = (.9 + Math.random() * 1.2) + 'rem';
    el.style.animationDuration = (8 + Math.random() * 10) + 's';
    el.style.animationDelay    = (Math.random() * 12) + 's';
    hBg.appendChild(el);
  }

  /* ── GALLERY ── */
  const imgs = [
    { src: '1000270913.jpg', label: 'Bridge Walk 🌤️' },
    { src: '1000271012.jpg', label: 'Cozy Cuddles 🌸' },
    { src: '1000270912.jpg', label: 'Bear Hug 🤗' },
    { src: '1000270918.jpg', label: 'Cloudy Love ☁️' },
    { src: '1000270927.jpg', label: 'Heart Hug 💗' },
    { src: '1000270929.jpg', label: 'Cinema Date 🎬' },
    { src: '1000270917.jpg', label: 'Seaside Pals 🌊' },
    { src: '1000270910.jpg', label: 'Scooter Ride 🛵' },
    { src: '1000270926.jpg', label: 'Tiny Love 💕' },
    { src: '1000270911.jpg', label: 'Missing You 🥺' },
    { src: '1000270925.jpg', label: 'Plushie Pair 🧸' },
    { src: '1000270924.jpg', label: 'Bucket Hats 🎩' },
    { src: '1000270908.jpg', label: 'Blanket Time 🛏️' },
    { src: '1000270923.jpg', label: 'Out & About 👜' },
    { src: '1000270909.jpg', label: 'Moonlit Night 🌙' },
    { src: '1000270921.jpg', label: 'Together Forever 💙' },
    { src: '1000270922.jpg', label: 'Car Fam 🚗' },
    { src: '1000270920.jpg', label: 'Hand-held Pair 🤲' },
    { src: '1000270919.jpg', label: 'Sticker Love 💛' },
    { src: '1000270906.jpg', label: 'Cherry Blossom Walk 🌸' },
    { src: '1000270907.jpg', label: 'Frying Pan Fury 🍳' },
    { src: '1000270905.jpg', label: 'Tree Stump Sit 🌳' },
    { src: '1000270903.jpg', label: 'Kissy Sticker 💋' },
    { src: '1000270904.jpg', label: 'Cake Sharing 🎂' },
  ];

  const grid = document.getElementById('galleryGrid');
  const lb   = document.getElementById('lightbox');
  const lbImg = document.getElementById('lightbox-img');

  imgs.forEach(({ src, label }) => {
    const card = document.createElement('div');
    card.className = 'gallery-card';
    card.innerHTML = `
      <img src="${src}" alt="${label}" loading="lazy" />
      <div class="overlay"><span>${label}</span></div>
    `;
    card.addEventListener('click', () => {
      lbImg.src = src; lbImg.alt = label;
      lb.classList.add('open');
    });
    grid.appendChild(card);
  });

  document.getElementById('lightbox-close').addEventListener('click', () => lb.classList.remove('open'));
  lb.addEventListener('click', e => { if (e.target === lb) lb.classList.remove('open'); });

  /* ── INTERSECTION OBSERVER — REVEAL ── */
  const revealEls = document.querySelectorAll('.reveal');
  const ro = new IntersectionObserver((entries) => {
    entries.forEach(e => {
      if (e.isIntersecting) { e.target.classList.add('visible'); ro.unobserve(e.target); }
    });
  }, { threshold: 0.12 });
  revealEls.forEach(el => ro.observe(el));


</script>
</body>
</html>
